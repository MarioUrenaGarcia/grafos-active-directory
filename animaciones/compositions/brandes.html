<template>
<style>
  #root { position: absolute; inset: 0; background: #ffffff; }
  #br-lienzo { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; }
</style>
<div id="root" data-composition-id="brandes" data-width="1600" data-height="1000">
  <svg id="br-lienzo" class="clip" data-start="0" data-duration="11" data-track-index="0"
       viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<script>
(function () {
  // Centralidad de intermediacion: cuantos caminos mas cortos entre pares de
  // objetos pasan por cada nodo. Un objeto puente concentra muchos caminos y,
  // si se protege, corta muchas rutas a la vez.
  const svg = document.getElementById("br-lienzo");
  const d = new Diagrama(svg);
  const P = PALETA;
  const izq = [200, 380, 560, 740].map((y, i) => [`br-a${i}`, 230, y, { tipo: "User", r: 22 }]);
  const der = [260, 500, 740].map((y, i) => [`br-b${i}`, 1330, y, { tipo: i === 1 ? "objetivo" : "Group", r: i === 1 ? 34 : 22 }]);
  d.desde(izq.concat(der, [["br-x", 800, 480, { tipo: "Computer", r: 22, etiqueta: "COMP00083", etqArriba: true }]]),
    izq.map(([id]) => [`${id}x`, id, "br-x", {}]).concat(der.map(([id]) => [`br-x${id}`, "br-x", id, {}])));
  const N = d.nodos, A = d.aristas;
  // El puente crece hasta radio 22 + 4 * 9: su nombre va sobre ese tamano final.
  N["br-x"].etq.setAttribute("y", 480 - (22 + 4 * 9) - 16);
  const valor = [0, 12, 24, 48, 76].map((v, i) => {
    const t = svgTexto(`intermediación = ${v}`, { x: 800, y: 600, "text-anchor": "middle", class: "etq-titulo", opacity: 0 }, d.capaEncima);
    return t;
  });
  // Caminos de cada origen a cada destino: todos cruzan el puente.
  const caminos = [];
  izq.forEach(([a], i) => der.forEach(([b], j) => {
    const A0 = N[a], B0 = N[b], X = N["br-x"];
    caminos.push(svgEl("path", { d: `M${A0.x} ${A0.y} L${X.x} ${X.y} L${B0.x} ${B0.y}`, fill: "none", stroke: "none" }, d.fondo));
  }));

  const tl = gsap.timeline({ paused: true });
  Object.values(N).forEach((n, i) => Mov.aparecer(tl, n, 0.2 + i * 0.07, { dur: 0.45 }));
  Object.values(A).forEach((a, i) => Mov.trazar(tl, a, 0.7 + i * 0.06, { dur: 0.45 }));
  Mov.mostrar(tl, valor[0], 1.5);
  // Las fichas recorren los caminos mas cortos; el puente crece con cada lote.
  caminos.forEach((c, i) => Mov.viajar(tl, d.ficha(`br-f${i}`, { r: 9, color: P.naranja }), c, 2.0 + i * 0.32, 1.1));
  [1, 2, 3, 4].forEach((k, i) => {
    const t = 3.0 + i * 1.0;
    tl.to(N["br-x"].c, { attr: { r: 22 + k * 9 }, duration: 0.5, ease: "back.out(1.6)" }, t);
    Mov.ocultar(tl, valor[k - 1], t, 0.15);
    Mov.mostrar(tl, valor[k], t + 0.1, 0.25);
  });
  tl.to(N["br-x"].c, { fill: P.naranja, duration: 0.4 }, 7.4);
  Mov.destello(tl, N["br-x"], 7.4, P.naranja);
  window.__timelines["brandes"] = tl;
  tl.seek(0);
})();
</script>
</template>
