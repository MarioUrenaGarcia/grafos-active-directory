<template>
<style>
  #root { position: absolute; inset: 0; background: #ffffff; }
  #ta-lienzo { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; }
</style>
<div id="root" data-composition-id="tarjan" data-width="1600" data-height="1000">
  <svg id="ta-lienzo" class="clip" data-start="0" data-duration="12" data-track-index="0"
       viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<script>
(function () {
  // Componentes fuertemente conexas: dentro de cada una todos se alcanzan
  // entre si (control mutuo). Al condensar cada componente en un solo nodo,
  // el grafo resultante no tiene ciclos (es un DAG).
  const svg = document.getElementById("ta-lienzo");
  const d = new Diagrama(svg);
  const P = PALETA;
  const gris = "#c9d1dd";
  const pos = { a: [200, 250], b: [420, 170], c: [400, 400], d: [720, 330], e: [900, 520],
                f: [1280, 420], g: [300, 700], h: [520, 820], i: [600, 620] };
  d.desde(Object.entries(pos).map(([k, [x, y]]) => [`ta-${k}`, x, y, { color: gris, r: 26, etiqueta: k, etqArriba: k === "b" }]),
  [["a", "b"], ["b", "c"], ["c", "a"], ["c", "d"], ["d", "e"], ["e", "d", { curva: 50 }], ["e", "f"], ["a", "g"], ["g", "h"], ["h", "i"], ["i", "g"], ["i", "e"]]
    .map(([x, y, o]) => [`ta-${x}${y}`, `ta-${x}`, `ta-${y}`, Object.assign({ ancho: 3, color: P.navy6 }, o || {})]));
  const N = k => d.nodos[`ta-${k}`];
  const comps = [
    { nodos: ["a", "b", "c"], color: P.azul, x: 340, y: 270, nombre: "C1 (3)" },
    { nodos: ["d", "e"], color: P.morado, x: 810, y: 425, nombre: "C2 (2)" },
    { nodos: ["f"], color: P.turquesa, x: 1280, y: 420, nombre: "C3 (1)" },
    { nodos: ["g", "h", "i"], color: P.naranja, x: 470, y: 715, nombre: "C4 (3)" },
  ];
  // Capa del grafo condensado: un supernodo por componente y sus aristas.
  const cond = new Diagrama(svgEl("g", {}, svg));
  // La letra de titulo es mas alta que la de nodo: la etiqueta se separa 14 px mas
  // del circulo. C1 la lleva arriba porque por debajo sale su arista hacia C4.
  comps.forEach((c, i) => {
    const n = cond.nodo(`ta-s${i}`, c.x, c.y, { color: c.color, r: 34 + c.nodos.length * 10, etiqueta: c.nombre, etqClase: "etq-titulo", etqArriba: i === 0 });
    n.etq.setAttribute("y", i === 0 ? c.y - n.r - 18 : c.y + n.r + 40);
  });
  [[0, 1], [1, 2], [0, 3], [3, 1]].forEach(([x, y]) => cond.arista(`ta-se${x}${y}`, `ta-s${x}`, `ta-s${y}`, { ancho: 6, color: P.navy }));

  const tl = gsap.timeline({ paused: true });
  Object.keys(pos).forEach((k, i) => Mov.aparecer(tl, N(k), 0.2 + i * 0.06, { dur: 0.4 }));
  Object.values(d.aristas).forEach((a, i) => Mov.trazar(tl, a, 0.7 + i * 0.07, { dur: 0.45 }));
  // El DFS de Tarjan cierra una componente cada vez que bajo[v] = indice[v]:
  // en ese momento sus nodos salen juntos de la pila y toman su color.
  // Orden real desde a: primero {f}, luego {d, e}, luego {g, h, i} y al final {a, b, c}.
  const cierre = [2, 1, 3, 0];
  cierre.forEach((ci, j) => {
    const c = comps[ci], t = 2.6 + j * 1.0;
    c.nodos.forEach((k, m) => { tl.to(N(k).c, { fill: c.color, duration: 0.3 }, t + m * 0.1); Mov.destello(tl, N(k), t + m * 0.1, c.color); });
  });
  // Condensar: el grafo original se atenua y aparece el DAG de componentes.
  const tC = 7.0;
  tl.to(d.capaNodos, { opacity: 0.15, duration: 0.6 }, tC);
  tl.to(d.capaAristas, { opacity: 0.1, duration: 0.6 }, tC);
  comps.forEach((c, i) => Mov.aparecer(tl, cond.nodos[`ta-s${i}`], tC + 0.3 + i * 0.15, { dur: 0.6 }));
  Object.values(cond.aristas).forEach((a, i) => Mov.trazar(tl, a, tC + 1.1 + i * 0.25, { dur: 0.5 }));
  window.__timelines["tarjan"] = tl;
  tl.seek(0);
})();
</script>
</template>
