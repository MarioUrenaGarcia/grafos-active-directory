<template>
<style>
  #root { position: absolute; inset: 0; background: #ffffff; }
  #ke-lienzo { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; }
</style>
<div id="root" data-composition-id="kerberos" data-width="1600" data-height="1000">
  <svg id="ke-lienzo" class="clip" data-start="0" data-duration="11" data-track-index="0"
       viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<script>
(function () {
  // Kerberos en tres intercambios: el usuario obtiene un TGT del KDC, lo
  // canjea por un ticket de servicio y presenta ese ticket al servidor.
  const svg = document.getElementById("ke-lienzo");
  const d = new Diagrama(svg);
  const P = PALETA;
  const usuario = d.caja("ke-us", 110, 590, 260, 120, { relleno: P.azul, borde: P.azul, texto: ["Usuario", "inicia sesión"], tinta: "#fff" });
  const kdc = d.caja("ke-kdc", 640, 140, 320, 130, { relleno: P.navy, borde: P.navy, texto: ["KDC", "en el controlador"], tinta: "#fff" });
  const srv = d.caja("ke-srv", 1220, 590, 280, 120, { relleno: P.turquesa, borde: P.turquesa, texto: ["Servidor", "del servicio"], tinta: "#fff" });
  // Trazos de cada intercambio (ida y vuelta separados para que no se encimen).
  const t1 = d.trazo("ke-t1", "M240 590 C240 380 420 220 640 190", { color: P.borde, ancho: 3 });
  const t2 = d.trazo("ke-t2", "M680 270 C640 420 480 540 330 590", { color: P.borde, ancho: 3 });
  const t3 = d.trazo("ke-t3", "M370 620 C560 560 700 420 760 270", { color: P.borde, ancho: 3 });
  const t4 = d.trazo("ke-t4", "M860 270 C860 520 640 660 370 690", { color: P.borde, ancho: 3 });
  const t5 = d.trazo("ke-t5", "M370 660 C700 700 950 700 1220 660", { color: P.borde, ancho: 3 });
  const etiquetas = [
    ["1. Pide un TGT", 300, 300], ["2. Recibe el TGT", 470, 420],
    ["3. Canjea el TGT", 760, 470], ["4. Ticket de servicio", 880, 560], ["5. Presenta el ticket", 800, 625],
  ].map(([txt, x, y]) => svgTexto(txt, { x, y, "text-anchor": "middle", class: "etq-chica", opacity: 0 }, d.capaEncima));
  const fPide = d.ficha("ke-f1", { ancho: 150, color: P.fondo, texto: "credencial" });
  const fTgt = d.ficha("ke-f2", { ancho: 80, color: P.ambar, texto: "TGT" });
  const fTgt2 = d.ficha("ke-f3", { ancho: 80, color: P.ambar, texto: "TGT" });
  const fTs = d.ficha("ke-f4", { ancho: 80, color: P.moradoClaro, texto: "TS" });
  const fTs2 = d.ficha("ke-f5", { ancho: 80, color: P.moradoClaro, texto: "TS" });
  const ok = d.caja("ke-ok", 1245, 760, 230, 60, { relleno: P.verde, borde: P.verde, texto: ["Acceso concedido"], tinta: "#fff", dyTexto: 8 });

  const tl = gsap.timeline({ paused: true });
  Mov.caja(tl, usuario.g, 0.2);
  Mov.caja(tl, kdc.g, 0.45);
  Mov.caja(tl, srv.g, 0.7);
  let t = 1.3;
  [[t1, fPide, 0], [t2, fTgt, 1], [t3, fTgt2, 2], [t4, fTs, 3], [t5, fTs2, 4]].forEach(([tr, f, i]) => {
    Mov.trazar(tl, tr, t, { dur: 0.5 });
    Mov.mostrar(tl, etiquetas[i], t + 0.3, 0.3);
    Mov.viajar(tl, f, tr.p, t + 0.45, 0.9, { quedarse: i === 4 });
    t += 1.55;
  });
  Mov.caja(tl, ok.g, t + 0.1);
  window.__timelines["kerberos"] = tl;
  tl.seek(0);
})();
</script>
</template>
