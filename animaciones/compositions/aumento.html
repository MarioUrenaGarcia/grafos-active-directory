<template>
<style>
  #root { position: absolute; inset: 0; background: #ffffff; }
  #au-lienzo { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; }
</style>
<div id="root" data-composition-id="aumento" data-width="1600" data-height="1000">
  <svg id="au-lienzo" class="clip" data-start="0" data-duration="13" data-track-index="0"
       viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<script>
(function () {
  // Edmonds-Karp: un BFS en la red residual encuentra el camino de aumento mas
  // corto de S a T; se envia por el su cuello de botella y los arcos que se
  // llenan quedan saturados. Cuando el BFS ya no llega a T, el flujo es maximo.
  const svg = document.getElementById("au-lienzo");
  const d = new Diagrama(svg);
  const R = RED_FLUJO;
  const A = construirRed(d, "au", { conCapacidad: true });
  const N = id => d.nodos[`au-${id}`];
  const morado = "#8e44ad", saturado = "#5b2d73";
  const flujos = [0, 1, 2, 3].map(v => {
    const t = svgTexto(`flujo = ${v}`, { x: 1180, y: 700, "text-anchor": "middle", class: "etq-titulo", opacity: 0 }, d.capaEncima);
    t.style.fontSize = "56px";
    return t;
  });
  const sinCamino = svgTexto("el BFS ya no llega a T: flujo máximo", { x: 800, y: 960, "text-anchor": "middle", class: "etq", opacity: 0 }, d.capaEncima);

  const tl = gsap.timeline({ paused: true });
  R.nodos.forEach(([id], i) => Mov.aparecer(tl, N(id), 0.15 + i * 0.04, { dur: 0.4 }));
  Object.values(A).forEach((a, i) => Mov.trazar(tl, a, 0.4 + i * 0.04, { dur: 0.4 }));
  tl.set(A["ou-b3"].p, { strokeDasharray: "10 9", strokeDashoffset: 0 }, 1.4);
  Mov.mostrar(tl, flujos[0], 1.6);
  // Cada camino de aumento: la ficha recorre S -> T, el camino se tinie de
  // morado y sus arcos de capacidad 1 quedan saturados (mas oscuros).
  R.caminos.forEach((cam, k) => {
    const t = 2.4 + k * 2.6;
    const d0 = cam.map(id => `${N(id).x} ${N(id).y}`).join(" L");
    const trazo = svgEl("path", { d: `M${d0}`, fill: "none", stroke: "none" }, d.fondo);
    for (let j = 0; j + 1 < cam.length; j++) Mov.colorArista(tl, A[`${cam[j]}-${cam[j + 1]}`], morado, t + j * 0.12, { ancho: 7 });
    Mov.viajar(tl, d.ficha(`au-f${k}`, { r: 13, color: "#ffd37a" }), trazo, t + 0.3, 1.3);
    for (let j = 0; j + 1 < cam.length; j++) {
      const clave = `${cam[j]}-${cam[j + 1]}`, cap = R.aristas.find(a => `${a[0]}-${a[1]}` === clave)[2];
      // Solo los arcos finitos se saturan; S, T y lo estructural tienen capacidad infinita.
      Mov.colorArista(tl, A[clave], cap === "1" ? saturado : "#c9b5d6", t + 1.8, { ancho: cap === "1" ? 7 : 4 });
    }
    Mov.ocultar(tl, flujos[k], t + 1.6, 0.15);
    Mov.mostrar(tl, flujos[k + 1], t + 1.75, 0.25);
  });
  // Un cuarto BFS se detiene: desde S solo se alcanza la zona izquierda.
  Mov.destello(tl, N("S"), 10.3, "#2e5aac");
  R.lado.forEach((id, i) => Mov.destello(tl, N(id), 10.5 + i * 0.08, "#2e5aac"));
  Mov.mostrar(tl, sinCamino, 10.9);
  window.__timelines["aumento"] = tl;
  tl.seek(0);
})();
</script>
</template>
