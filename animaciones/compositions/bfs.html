<template>
<style>
  #root { position: absolute; inset: 0; background: #ffffff; }
  #bf-lienzo { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; }
</style>
<div id="root" data-composition-id="bfs" data-width="1600" data-height="1000">
  <svg id="bf-lienzo" class="clip" data-start="0" data-duration="13" data-track-index="0"
       viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<script>
(function () {
  // BFS por niveles: se saca un nodo del frente de la cola, se descubren sus
  // vecinos no visitados y se ponen al final. El primer camino que llega al
  // objetivo es el de menos saltos. La fila inferior muestra la cola.
  const svg = document.getElementById("bf-lienzo");
  const d = new Diagrama(svg);
  const P = PALETA;
  const gris = "#c9d1dd";
  const pos = { S: [170, 430], A: [470, 200], B: [470, 430], C: [470, 660], D: [790, 130], E: [790, 330],
                F: [790, 540], G: [790, 720], T: [1110, 330], H: [1110, 620] };
  d.desde(Object.entries(pos).map(([k, [x, y]]) => [`bf-${k}`, x, y,
    { color: k === "T" ? P.rojo : gris, r: k === "T" ? 34 : 26, etiqueta: k === "S" ? "S (origen)" : k === "T" ? "T (objetivo)" : k,
      // La etiqueta larga de S se corre a la izquierda para librar la arista que baja hacia C.
      etqDx: k === "S" ? -44 : 0 }]),
  [["S", "A"], ["S", "B"], ["S", "C"], ["A", "D"], ["A", "E"], ["B", "E"], ["B", "F"], ["C", "G"], ["E", "T"], ["F", "H"], ["G", "H"]]
    .map(([a, b]) => [`bf-${a}${b}`, `bf-${a}`, `bf-${b}`, { ancho: 3 }]));
  const N = k => d.nodos[`bf-${k}`], A = (a, b) => d.aristas[`bf-${a}${b}`];
  const niveles = [[170, "nivel 0"], [470, "nivel 1"], [790, "nivel 2"], [1110, "nivel 3"]].map(([x, t]) =>
    svgTexto(t, { x, y: 60, "text-anchor": "middle", class: "etq-zona", opacity: 0 }, d.fondo));
  const orden = ["S", "A", "B", "C", "D", "E", "F", "G", "T"];
  const cola = orden.map((k, i) => d.caja(`bf-q${i}`, 200 + i * 132, 845, 110, 80, { relleno: "#ffffff", borde: P.azul, grosor: 3, texto: [k], dyTexto: 9 }));
  const rotulo = svgTexto("cola (orden de descubrimiento)", { x: 200, y: 800, class: "etq-ar", opacity: 0 }, d.fondo);
  const frente = svgEl("polygon", { points: "0,0 -14,-22 14,-22", fill: P.naranja, opacity: 0 }, d.capaEncima);

  const tl = gsap.timeline({ paused: true });
  Object.keys(pos).forEach((k, i) => Mov.aparecer(tl, N(k), 0.2 + i * 0.05, { dur: 0.4 }));
  Object.values(d.aristas).forEach((a, i) => Mov.trazar(tl, a, 0.5 + i * 0.04, { dur: 0.4 }));
  niveles.forEach((n, i) => Mov.mostrar(tl, n, 0.8 + i * 0.1));
  Mov.mostrar(tl, rotulo, 1.0);
  // Descubrir: el nodo pasa a la frontera (azul) y entra a la cola.
  let iCola = 0;
  const descubrir = (k, t, desde) => {
    if (desde) Mov.colorArista(tl, A(desde, k), P.azul, t, { ancho: 4 });
    if (k !== "T") tl.to(N(k).c, { fill: "#ffffff", stroke: P.azul, strokeWidth: 5, duration: 0.3 }, t + 0.1);
    Mov.caja(tl, cola[iCola++].g, t + 0.1, { dur: 0.35 });
  };
  // Expandir: el nodo sale por el frente y queda cerrado (relleno azul).
  const expandir = (k, i, t) => {
    tl.fromTo(frente, { attr: { transform: `translate(${255 + i * 132} 838)` }, opacity: i ? 1 : 0 },
      { attr: { transform: `translate(${255 + i * 132} 838)` }, opacity: 1, duration: 0.25 }, t);
    tl.to(cola[i].rect, { fill: P.fondo, stroke: P.borde, duration: 0.3 }, t + 0.2);
    tl.to(N(k).c, { fill: P.azul, stroke: "#ffffff", strokeWidth: 3, duration: 0.3 }, t);
    Mov.destello(tl, N(k), t, P.naranja);
  };
  descubrir("S", 1.6);
  const pasos = [["S", ["A", "B", "C"]], ["A", ["D", "E"]], ["B", ["F"]], ["C", ["G"]], ["D", []], ["E", ["T"]]];
  let t = 2.3;
  pasos.forEach(([k, vecinos], i) => {
    expandir(k, i, t);
    vecinos.forEach((v, j) => descubrir(v, t + 0.35 + j * 0.25, k));
    t += 0.55 + Math.max(1, vecinos.length) * 0.3;
  });
  // T se descubrio: el arbol BFS da el camino mas corto S, A, E, T.
  const fin = t + 0.3;
  [["S", "A"], ["A", "E"], ["E", "T"]].forEach(([a, b], i) => Mov.colorArista(tl, A(a, b), P.naranja, fin + i * 0.3, { ancho: 7 }));
  Mov.destello(tl, N("T"), fin + 0.9, P.rojo);
  window.__timelines["bfs"] = tl;
  tl.seek(0);
})();
</script>
</template>
