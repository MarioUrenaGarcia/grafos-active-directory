<template>
<style>
  #root { position: absolute; inset: 0; background: #ffffff; }
  #wb-lienzo { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; }
</style>
<div id="root" data-composition-id="web" data-width="1600" data-height="1000">
  <svg id="wb-lienzo" class="clip" data-start="0" data-duration="13" data-track-index="0"
       viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<script>
(function () {
  // La aplicacion web: el navegador pide la pagina y luego JSON a la API; el
  // servidor ejecuta el algoritmo instrumentado sobre el grafo en memoria y
  // devuelve su traza, que la pagina reproduce paso a paso.
  const svg = document.getElementById("wb-lienzo");
  const d = new Diagrama(svg);
  const P = PALETA;
  const nav = d.caja("wb-nav", 60, 200, 520, 600, { relleno: "#ffffff", borde: P.navy, grosor: 4, texto: ["navegador"], clase: "etq-titulo", dyTexto: -255 });
  const srv = d.caja("wb-srv", 760, 380, 330, 140, { relleno: P.navy, borde: P.navy, texto: ["servidor.py", "127.0.0.1:8000"], tinta: "#fff", clase: "etq-mono", clase2: "etq-caja2" });
  const tra = d.caja("wb-tra", 1230, 220, 300, 120, { relleno: P.morado, borde: P.morado, texto: ["trazas.py", "BFS, Dijkstra, flujo"], tinta: "#fff", clase: "etq-mono", clase2: "etq-caja2" });
  const mod = d.caja("wb-mod", 1230, 580, 300, 120, { relleno: P.azul, borde: P.azul, texto: ["grafo en memoria", "953 nodos, 4698 aristas"], tinta: "#fff", clase: "etq-caja", clase2: "etq-caja2" });
  // Mini grafo dentro del navegador, que se llena al recibir los datos.
  const mini = new Diagrama(svgEl("g", {}, svg));
  const mpos = [[160, 480], [260, 360], [260, 600], [370, 300], [370, 470], [370, 650], [480, 480]];
  mpos.forEach(([x, y], i) => mini.nodo(`wb-m${i}`, x, y, { color: i === 6 ? P.rojo : "#c9d1dd", r: i === 6 ? 20 : 14 }));
  [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [4, 6], [5, 6], [3, 6]].forEach(([a, b], i) => mini.arista(`wb-me${i}`, `wb-m${a}`, `wb-m${b}`, { ancho: 2.5 }));
  const ida = d.trazo("wb-ida", "M580 420 C650 420 690 440 760 440", { color: P.borde, ancho: 3 });
  const vuelta = d.trazo("wb-vuelta", "M760 470 C690 480 650 500 580 500", { color: P.borde, ancho: 3 });
  const aTra = d.trazo("wb-at", "M1090 420 C1160 400 1180 300 1230 290", { color: P.borde, ancho: 3 });
  const aMod = d.trazo("wb-am", "M1380 340 L1380 580", { color: P.borde, ancho: 3 });
  const peticiones = [
    ["GET /", "HTML", 1.6],
    ["GET /api/grafo", "grafo JSON", 4.0],
    ["GET /api/bfs", "traza JSON", 7.0],
  ];

  const tl = gsap.timeline({ paused: true });
  Mov.caja(tl, nav.g, 0.2); Mov.caja(tl, srv.g, 0.45); Mov.caja(tl, tra.g, 0.7); Mov.caja(tl, mod.g, 0.85);
  [ida, vuelta, aTra, aMod].forEach((t, i) => Mov.trazar(tl, t, 1.0 + i * 0.1, { dur: 0.4 }));
  peticiones.forEach(([pide, recibe, t], k) => {
    const fp = d.ficha(`wb-p${k}`, { ancho: Math.max(140, pide.length * 11), color: "#ffd37a", texto: pide });
    Mov.viajar(tl, fp, ida.p, t, 0.8);
    if (k > 0) {
      const f1 = d.ficha(`wb-t${k}`, { r: 10, color: P.morado });
      Mov.viajar(tl, f1, aTra.p, t + 0.8, 0.5);
      const f2 = d.ficha(`wb-g${k}`, { r: 10, color: P.azul });
      Mov.viajar(tl, f2, aMod.p, t + 1.15, 0.45);
    }
    const fr = d.ficha(`wb-r${k}`, { ancho: Math.max(140, recibe.length * 11), color: "#e3eefb", texto: recibe });
    Mov.viajar(tl, fr, vuelta.p, t + (k ? 1.7 : 0.9), 0.8);
  });
  // Llegan los datos del grafo: el mini grafo aparece en el navegador.
  mpos.forEach((_, i) => Mov.aparecer(tl, mini.nodos[`wb-m${i}`], 5.8 + i * 0.06, { dur: 0.4 }));
  Object.values(mini.aristas).forEach((a, i) => Mov.trazar(tl, a, 6.0 + i * 0.05, { dur: 0.4 }));
  // Llega la traza: la pagina la reproduce paso a paso.
  [0, 1, 4, 6].forEach((i, k) => {
    tl.to(mini.nodos[`wb-m${i}`].c, { fill: i === 6 ? P.rojo : P.azul, duration: 0.25 }, 9.6 + k * 0.45);
    Mov.destello(tl, mini.nodos[`wb-m${i}`], 9.6 + k * 0.45, P.naranja);
  });
  [["wb-me0", 9.8], ["wb-me3", 10.25], ["wb-me5", 10.7]].forEach(([k, t]) => Mov.colorArista(tl, mini.aristas[k], P.naranja, t, { ancho: 5 }));
  window.__timelines["web"] = tl;
  tl.seek(0);
})();
</script>
</template>
