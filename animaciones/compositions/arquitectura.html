<template>
<style>
  #root { position: absolute; inset: 0; background: #ffffff; }
  #aq-lienzo { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; }
</style>
<div id="root" data-composition-id="arquitectura" data-width="1600" data-height="1000">
  <svg id="aq-lienzo" class="clip" data-start="0" data-duration="12" data-track-index="0"
       viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<script>
(function () {
  // Dependencias reales entre los modulos de grafo_ad (segun sus import),
  // construidas de la base hacia arriba. Cada flecha apunta al modulo que se
  // importa. Todos los modulos de analisis usan tambien modelo.
  const svg = document.getElementById("aq-lienzo");
  const d = new Diagrama(svg);
  const P = PALETA;
  const capas = [
    [890, ["modelo", "pesos", "interfaz_web"]],
    [700, ["recorridos", "componentes", "transitiva", "caminos"]],
    [510, ["centralidad", "cortes", "riesgo", "consultas", "trazas"]],
    [320, ["reporte", "visor", "servidor"]],
    [130, ["cli", "main"]],
  ];
  const colores = [P.navy, P.azul, P.morado, P.turquesa, P.naranja];
  const caja = {};
  capas.forEach(([y, mods], c) => mods.forEach((m, i) => {
    const w = 230, x = 800 - (mods.length * (w + 40) - 40) / 2 + i * (w + 40);
    caja[m] = Object.assign(d.caja(`aq-${m}`, x, y - 38, w, 76, { relleno: colores[c], borde: colores[c], texto: [m + ".py"], tinta: "#fff", clase: "etq-mono", dyTexto: 8 }), { capa: c });
  }));
  const deps = [
    ["recorridos", "modelo"], ["componentes", "modelo"], ["transitiva", "modelo"], ["caminos", "modelo"], ["caminos", "pesos"],
    ["centralidad", "recorridos"], ["cortes", "recorridos"], ["riesgo", "recorridos"], ["consultas", "recorridos"], ["trazas", "recorridos"], ["trazas", "pesos"],
    ["reporte", "consultas"], ["reporte", "centralidad"], ["reporte", "cortes"], ["reporte", "riesgo"],
    ["visor", "cortes"], ["visor", "interfaz_web"], ["visor", "pesos"],
    ["servidor", "cortes"], ["servidor", "trazas"], ["servidor", "interfaz_web"],
    ["cli", "reporte"], ["cli", "visor"], ["cli", "servidor"], ["main", "cli"],
  ];
  // Las dependencias que saltan una capa bajan por los huecos de 40 px entre
  // cajas; en linea recta pasarian por debajo de los modulos intermedios.
  const rutas = {
    "visor>pesos": "M800 358 C800 410 665 420 665 472 L665 548 C665 600 800 610 800 662 L800 842",
    "visor>interfaz_web": "M800 358 C800 410 935 420 935 472 L935 548 C935 600 1070 610 1070 662 L1070 842",
    "servidor>interfaz_web": "M1070 358 C1070 410 1205 420 1205 472 L1205 548 C1205 600 1070 610 1070 662 L1070 842",
    "trazas>pesos": "M1340 548 L1340 740 C1340 800 800 780 800 842",
  };
  const flechas = deps.map(([a, b], i) => {
    const A0 = caja[a], B0 = caja[b];
    const x1 = A0.cx, y1 = A0.y + A0.h, x2 = B0.cx, y2 = B0.y;
    const mismo = A0.capa === B0.capa;
    const dd = rutas[`${a}>${b}`] || (mismo ? (A0.x > B0.x ? `M${A0.x} ${A0.cy} L${B0.x + B0.w + 10} ${B0.cy}` : `M${A0.x + A0.w} ${A0.cy} L${B0.x - 10} ${B0.cy}`) : `M${x1} ${y1} C${x1} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2} ${y2 - 10}`);
    const tr = d.trazo(`aq-d${i}`, dd, { color: "#9aa7b8", ancho: 2.5 });
    // Punta de flecha en el extremo del trazo.
    const fin = tr.p.getPointAtLength(tr.largo), antes = tr.p.getPointAtLength(Math.max(0, tr.largo - 12));
    const ux = fin.x - antes.x, uy = fin.y - antes.y, L = Math.hypot(ux, uy) || 1;
    const nx = ux / L, ny = uy / L;
    const punta = svgEl("polygon", { points: `${fin.x + nx * 8},${fin.y + ny * 8} ${fin.x - nx * 6 - ny * 7},${fin.y - ny * 6 + nx * 7} ${fin.x - nx * 6 + ny * 7},${fin.y - ny * 6 - nx * 7}`, fill: "#9aa7b8", opacity: 0 }, tr.g);
    tr.flecha = punta;
    return { tr, a, b };
  });

  const tl = gsap.timeline({ paused: true });
  capas.forEach(([_, mods], c) => mods.forEach((m, i) => Mov.caja(tl, caja[m].g, 0.3 + c * 1.5 + i * 0.1)));
  flechas.forEach(({ tr, a }) => {
    const t = 0.3 + caja[a].capa * 1.5 + 0.5;
    Mov.trazar(tl, tr, t + flechas.indexOf(flechas.find(f => f.tr === tr)) * 0.02, { dur: 0.5 });
  });
  // Recorrido de una orden: main llama a cli, cli al servidor, y este baja a los algoritmos.
  [["main", "cli"], ["cli", "servidor"], ["servidor", "trazas"], ["trazas", "recorridos"]].forEach(([a, b], i) => {
    const f = flechas.find(x => x.a === a && x.b === b);
    Mov.colorArista(tl, f.tr, P.naranja, 8.6 + i * 0.35, { ancho: 5 });
  });
  window.__timelines["arquitectura"] = tl;
  tl.seek(0);
})();
</script>
</template>
